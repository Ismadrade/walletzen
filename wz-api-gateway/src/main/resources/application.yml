server:
  port: 8765

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

spring:
  application:
    name: wz-api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      routes:
        - id: wz-user
          uri: lb://wz-user
          predicates:
            - Path=/users/**
        - id: wz-financial
          uri: lb://wz-financial
          predicates:
            - Path=/financial/**
