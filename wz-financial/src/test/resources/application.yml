server:
  port: 0

spring:
  application:
    name: wz-financial
  cloud:
    config:
      enabled: false
  config:
    import: ""
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:9999/certs   # dummy — nunca buscado (mockJwt nos testes)
  datasource:
    url: jdbc:h2:mem:wz-financial;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
  # Testes usam o schema gerado pelo Hibernate (H2); as migrations Flyway
  # (SQL Postgres) só rodam contra Postgres — cobertas na Fase 7 (Testcontainers).
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
  kafka:
    bootstrap-servers: localhost:9092
    listener:
      auto-startup: false
    admin:
      fail-fast: false
      properties:
        default.api.timeout.ms: 2000
        request.timeout.ms: 1500
    retry:
      topic:
        enabled: false   # @RetryableTopic desligado nos testes (sem broker)
    consumer:
      group-id: wz-financial-group
    topic:
      wz-user-deleted: wz-user-deleted
      wz-transaction-events: wz-transaction-events

# Poller da Outbox: intervalo alto nos testes para não competir com as asserções.
outbox:
  poll-interval: 60000

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false
