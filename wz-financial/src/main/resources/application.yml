spring:
  application:
    name: wz-financial
  # Toda a configuração de ambiente (datasource, kafka, eureka) vem do config-server.
  # optional: -> o serviço sobe mesmo que o config-server esteja fora do ar.
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  cloud:
    config:
      fail-fast: false
