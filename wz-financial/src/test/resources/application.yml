server:
  port: 0

spring:
  application:
    name: wz-financial
  datasource:
    url: jdbc:h2:mem:wz-financial;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
  kafka:
    bootstrap-servers: localhost:9092
    listener:
      auto-startup: false
    consumer:
      group-id: wz-financial-group
    topic:
      wz-user-deleted: wz-user-deleted

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false
