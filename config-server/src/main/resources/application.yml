server:
  port: 8888

spring:
  application:
    name: config-server
  # Backend do Config Server escolhido por profile:
  #   git (default) -> lê do repositório walletzen-repository (exige GIT_USERNAME/GIT_PASSWORD)
  #   native        -> lê de ./config-repo, cópia offline (sem GitHub, sem token)
  # Válvula de escape offline: SPRING_PROFILES_ACTIVE=native
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:git}

management:
  endpoints:
    web:
      exposure:
        include: health,info
