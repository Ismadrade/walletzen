plugins {
	id 'java'
	id 'org.springframework.boot' version '3.4.5'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'br.com.walletzen'
version = '0.0.1-SNAPSHOT'

ext['spring-cloud.version'] = '2024.0.1'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${property('spring-cloud.version')}"
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.mapstruct:mapstruct:1.6.3'
	implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client:4.2.1'
	implementation("org.springframework.kafka:spring-kafka:3.3.5")
	implementation 'org.springframework.cloud:spring-cloud-starter-config'
	// Chamada síncrona wz-financial -> wz-user (resolvida pelo Eureka) com resiliência.
	implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
	implementation 'org.springframework.cloud:spring-cloud-starter-loadbalancer'
	implementation 'io.github.resilience4j:resilience4j-spring-boot3'
	implementation 'org.springframework.boot:spring-boot-starter-aop'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-database-postgresql'

	// Pin patched versions of libraries that arrive transitively (via
	// spring-cloud-starter-netflix-eureka-client -> Netflix Eureka/Archaius/Servo).
	// Not used directly by this module, so they are constraints, not dependencies.
	constraints {
		implementation('com.thoughtworks.xstream:xstream:1.4.21') {
			because 'deserialization CVEs (e.g. CVE-2024-47072) affect <= 1.4.20'
		}
		implementation('org.apache.httpcomponents:httpclient:4.5.13') {
			because 'CVE-2020-13956 affects <= 4.5.12'
		}
		implementation('com.google.guava:guava:32.0.1-android') {
			because 'CVE-2023-2976 / CVE-2020-8908 affect older versions'
		}
	}

	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation("org.springframework.kafka:spring-kafka-test:3.3.5")
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testRuntimeOnly 'com.h2database:h2'
}

tasks.named('test') {
	useJUnitPlatform()
}

// Só o jar executável do Spring Boot (bootJar); evita o *-plain.jar e o
// COPY build/libs/*.jar ambíguo no Dockerfile.
tasks.named('jar') {
	enabled = false
}
