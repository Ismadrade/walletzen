# Tema de login do WalletZen.
#
# Herda do tema nativo `keycloak.v2` (PatternFly v5) e só acrescenta CSS — o HTML
# continua sendo o do Keycloak, então atualizações da imagem não quebram o tema.
# `styles` substitui a lista do pai, por isso o styles.css dele vem primeiro.

parent=keycloak.v2
import=common/keycloak

styles=css/styles.css css/login.css
