server:
  port: 8888

spring:
  application:
    name: config-server
  # Backend do Config Server escolhido por profile:
  #   native (default) -> lê de ./config-repo, sem depender do GitHub
  #   git              -> lê do repositório walletzen-repository (exige GIT_USERNAME/GIT_PASSWORD)
  # Sobrescreva com SPRING_PROFILES_ACTIVE=git quando quiser o backend remoto.
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:native}

management:
  endpoints:
    web:
      exposure:
        include: health,info
