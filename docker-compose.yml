services:

  wz-user-db:
    image: postgres:latest
    container_name: wz-user-db
    networks:
      - wallet-zen
    environment:
      - POSTGRES_DB=wz-user-db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wz-user-db"]
      interval: 10s
      timeout: 5s
      retries: 5

  wz-financial-db:
    image: postgres:latest
    container_name: wz-financial-db
    networks:
      - wallet-zen
    environment:
      - POSTGRES_DB=wz-financial-db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wz-financial-db"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    container_name: kafka
    image: obsidiandynamics/kafka
    restart: "no"
    ports:
      - "2181:2181"
      - "9092:9092"
    networks:
      - wallet-zen
    environment:
      KAFKA_LISTENERS: "INTERNAL://:29092,EXTERNAL://:9092"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:29092,EXTERNAL://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_ZOOKEEPER_SESSION_TIMEOUT: "6000"
      KAFKA_RESTART_ATTEMPTS: "10"
      KAFKA_RESTART_DELAY: "5"
      ZOOKEEPER_AUTOPURGE_PURGE_INTERVAL: "0"
    volumes:
      - ./data/kafka/data:/var/lib/kafka/data

  redpanda-console:
    container_name: redpanda
    image: docker.redpanda.com/vectorized/console:latest
    restart: on-failure
    entrypoint: /bin/sh
    command: -c "echo \"$$CONSOLE_CONFIG_FILE\" > /tmp/config.yml; /app/console"
    ports:
      - "8081:8080"
    networks:
      - wallet-zen
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
      CONSOLE_CONFIG_FILE: |
        kafka:
          brokers: ["kafka:29092"]
    depends_on:
      - "kafka"

  wz-service-registry:
    build: ./wz-service-registry
    image: walletzen/wz-service-registry:latest
    container_name: wz-service-registry
    restart: unless-stopped
    networks:
      - wallet-zen
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  wz-api-gateway:
    build: ./wz-api-gateway
    image: walletzen/wz-api-gateway:latest
    container_name: wz-api-gateway
    restart: unless-stopped
    networks:
      - wallet-zen
    ports:
      - "8765:8765"
    environment:
      - EUREKA_HOST=wz-service-registry
      - EUREKA_PORT=8761
      - CONFIG_SERVER_URL=http://config-server:8888
      - KEYCLOAK_JWKS_URI=http://keycloak:8080/realms/walletzen/protocol/openid-connect/certs
      - FRONTEND_ORIGIN=http://localhost:5173
    depends_on:
      wz-service-registry:
        condition: service_healthy
      config-server:
        condition: service_healthy
      keycloak:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8765/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  config-server:
    build: ./config-server
    image: walletzen/config-server:latest
    container_name: config-server
    restart: unless-stopped
    networks:
      - wallet-zen
    ports:
      - "8888:8888"
    environment:
      # No compose o config-server usa o backend 'native' por padrao (config-repo/
      # embutido na imagem) — sobe sem token. Para exercitar o backend git:
      # CONFIG_SERVER_PROFILE=git + GIT_USERNAME/GIT_PASSWORD no .env.
      - SPRING_PROFILES_ACTIVE=${CONFIG_SERVER_PROFILE:-native}
      - GIT_USERNAME=${GIT_USERNAME:-}
      - GIT_PASSWORD=${GIT_PASSWORD:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8888/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    container_name: keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    networks:
      - wallet-zen
    ports:
      - "8080:8080"
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=${KC_ADMIN:-admin}
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${KC_ADMIN_PASSWORD:-admin}
    volumes:
      - ./keycloak/realm-walletzen.json:/opt/keycloak/data/import/realm-walletzen.json:ro
    # Sem healthcheck: a imagem ubi-micro não tem shell. Os serviços usam jwk-set-uri
    # lazy e dependem só de 'service_started'.

  wz-user:
    build: ./wz-user
    image: walletzen/wz-user:latest
    container_name: wz-user
    restart: unless-stopped
    networks:
      - wallet-zen
    ports:
      - "8091:8091"
    environment:
      - EUREKA_HOST=wz-service-registry
      - EUREKA_PORT=8761
      - CONFIG_SERVER_URL=http://config-server:8888
      - KEYCLOAK_JWKS_URI=http://keycloak:8080/realms/walletzen/protocol/openid-connect/certs
      - KEYCLOAK_ADMIN_BASE_URL=http://keycloak:8080
      - KEYCLOAK_TOKEN_URI=http://keycloak:8080/realms/walletzen/protocol/openid-connect/token
      - WZ_USER_KC_SECRET=wz-user-service-secret
      - DB_HOST=wz-user-db
      - DB_PORT=5432
      - DB_NAME=wz-user-db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - KAFKA_BROKER=kafka:29092
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=75
    depends_on:
      wz-user-db:
        condition: service_healthy
      kafka:
        condition: service_started
      wz-service-registry:
        condition: service_healthy
      config-server:
        condition: service_healthy
      keycloak:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8091/users/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 90s

  wz-financial:
    build: ./wz-financial
    image: walletzen/wz-financial:latest
    container_name: wz-financial
    restart: unless-stopped
    networks:
      - wallet-zen
    ports:
      - "8094:8094"
    environment:
      - EUREKA_HOST=wz-service-registry
      - EUREKA_PORT=8761
      - CONFIG_SERVER_URL=http://config-server:8888
      - KEYCLOAK_JWKS_URI=http://keycloak:8080/realms/walletzen/protocol/openid-connect/certs
      - DB_HOST=wz-financial-db
      - DB_PORT=5432
      - DB_NAME=wz-financial-db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - KAFKA_BROKER=kafka:29092
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=75
    depends_on:
      wz-financial-db:
        condition: service_healthy
      kafka:
        condition: service_started
      wz-service-registry:
        condition: service_healthy
      config-server:
        condition: service_healthy
      keycloak:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8094/financial/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 90s

networks:
  wallet-zen:
    driver: bridge