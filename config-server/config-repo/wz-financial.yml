server:
  port: 8094
  servlet:
    context-path: /financial

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:wz-financial-db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BROKER:localhost:9092}
    consumer:
      group-id: wz-financial-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    topic:
      wz-user-deleted: wz-user-deleted
      wz-transaction-events: wz-transaction-events
  cloud:
    openfeign:
      client:
        config:
          wz-user:
            connect-timeout: 2000
            read-timeout: 2000

# Resiliência da validação síncrona do dono do lançamento em wz-user (POST /financial/transactions).
resilience4j:
  circuitbreaker:
    instances:
      wz-user:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: true
        ignore-exceptions:
          - br.com.walletzen.exception.UnknownUserException
  retry:
    instances:
      wz-user:
        max-attempts: 3
        wait-duration: 200ms
        retry-exceptions:
          - feign.FeignException
          - java.io.IOException
        ignore-exceptions:
          - br.com.walletzen.exception.UnknownUserException

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh,circuitbreakers,retries,scheduledtasks
  health:
    circuitbreakers:
      enabled: true

# Publicação de eventos de domínio via Outbox (poller). Ver plano 08 / Fase 4.
outbox:
  poll-interval: 1000        # ms entre varreduras do poller (fixedDelay)
  batch-size: 100            # nº de linhas não publicadas por rodada
  retention: 7d              # linhas publicadas mais antigas que isso são apagadas
  purge-cron: "0 0 3 * * *"  # limpeza diária às 03:00
