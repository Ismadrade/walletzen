server:
  port: 8765

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:${EUREKA_PORT:8761}/eureka

spring:
  application:
    name: wz-api-gateway
  # Config comum (management, marcador) vem do config-server; as rotas seguem locais.
  # optional: -> o gateway sobe mesmo que o config-server esteja fora do ar.
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  cloud:
    config:
      fail-fast: false
    gateway:
      discovery:
        locator:
          enabled: true
      routes:
        - id: wz-user
          uri: lb://wz-user
          predicates:
            - Path=/users/**
        - id: wz-financial
          uri: lb://wz-financial
          predicates:
            - Path=/financial/**
