# Perfil de teste: não depende de config-server, Postgres, Kafka ou Eureka.
spring:
  cloud:
    config:
      enabled: false
  config:
    import: ""
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:9999/certs   # dummy — nunca buscado (mockJwt nos testes)
  datasource:
    url: jdbc:h2:mem:wz-user;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
  # Testes usam o schema gerado pelo Hibernate (H2); as migrations Flyway
  # (SQL Postgres) só rodam contra Postgres — cobertas na Fase 7 (Testcontainers).
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
  kafka:
    bootstrap-servers: localhost:9092
    listener:
      auto-startup: false
    admin:
      fail-fast: false
      properties:
        default.api.timeout.ms: 2000
        request.timeout.ms: 1500
    topic:
      wz-user-deleted: wz-user-deleted

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

# Dummy — o adapter do Keycloak é lazy; nos testes o port é mockado.
keycloak:
  admin:
    base-url: http://localhost:9999
    realm: test
    token-uri: http://localhost:9999/token
    client-id: test
    client-secret: test
