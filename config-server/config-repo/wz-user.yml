server:
  port: 8091
  servlet:
    context-path: /users

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:wz-user-db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BROKER:localhost:9092}
    topic:
      wz-user-deleted: wz-user-deleted

# Acesso à Admin API do Keycloak — o wz-user provisiona o login ao criar uma pessoa.
keycloak:
  admin:
    base-url: ${KEYCLOAK_ADMIN_BASE_URL:http://localhost:8080}
    realm: walletzen
    token-uri: ${KEYCLOAK_TOKEN_URI:http://localhost:8080/realms/walletzen/protocol/openid-connect/token}
    client-id: wz-user-service
    client-secret: ${WZ_USER_KC_SECRET:wz-user-service-secret}
