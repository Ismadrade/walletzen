server:
  port: 0

spring:
  application:
    name: wz-financial
  cloud:
    config:
      enabled: false
  config:
    import: ""
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:9999/certs   # dummy — nunca buscado (mockJwt nos testes)
  datasource:
    url: jdbc:h2:mem:wz-financial;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
  # Testes usam o schema gerado pelo Hibernate (H2); as migrations Flyway
  # (SQL Postgres) só rodam contra Postgres — cobertas na Fase 7 (Testcontainers).
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
  kafka:
    bootstrap-servers: localhost:9092
    listener:
      auto-startup: false
    consumer:
      group-id: wz-financial-group
    topic:
      wz-user-deleted: wz-user-deleted

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false
